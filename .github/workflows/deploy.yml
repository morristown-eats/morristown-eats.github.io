name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Astro site
        run: npm run build

      # morristowneats.com is served by Cloudflare Pages project "morristowneats"
      # (direct upload), NOT GitHub Pages — discovered 2026-06-11. This step is
      # the deploy that actually reaches the domain; GitHub Pages below is a
      # mirror at morristown-eats.github.io.
      - name: Deploy to Cloudflare Pages (the domain's real host)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d17ca0bc458a3f3d320952a7b03d2fe7
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret not set — morristowneats.com was NOT updated (only the github.io mirror). Add the repo secret to fix."
            exit 0
          fi
          npx wrangler pages deploy dist --project-name morristowneats --commit-dirty=true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
